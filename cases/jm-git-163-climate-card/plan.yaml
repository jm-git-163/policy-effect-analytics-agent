# 작성자: 문정미 (jm-git-163)
# 분석 계획서 (사전 등록). 스키마: core/schema/plan.py / 작성 요령: docs/strategy/plan-guide.md
#
# 미리 밝혀 둘 것
# - 이 주제는 개인 저장소(jm-git-163/subway-did-climate-card)에서 서울·부산 역 단위로 먼저 탐색했다.
#   그때 서울·부산 2022-07~2024-12 값을 이미 보았으므로, 이 계획은 "데이터를 전혀 보지 않은 계획"이 아니다.
# - 이번 계획에서 새로 정한 것: 분석 단위를 도시(운영기관)로 올림, 비교 도시에 대구·광주·대전 추가,
#   기간을 K-패스 시행(2024-05-01) 전인 2024-04까지로 자름. 대구·광주·대전 자료는 아직 열어 보지 않았다.
# - 바뀐 이유와 탐색 때 본 결과는 README.md와 discussion.md에 적는다.
#
# 시간 인덱스: month_idx 0 = 2022-07, 17 = 2023-12, 18 = 2024-01, 19 = 2024-02, 21 = 2024-04
# 2024-01(18)은 정책이 월 중간(1/27)에 시작되어 모든 도시에서 추정에서 뺀다(fetch.py에서 처리·검사).

case_id: jm-git-163-climate-card
title: "서울 기후동행카드 시범사업 전후 지하철 승차 흐름 비교 (서울 vs 다른 광역시 도시철도)"
question: >-
  서울 기후동행카드 시범사업(2024-01-27) 전후로, 서울교통공사 1~8호선의 평일 승차 인원 흐름은
  같은 기간 부산·대구·광주·대전 도시철도와 비교해 어떻게 달랐는가?
  그리고 공개 자료만으로 그 차이를 정책 효과로 판단할 수 있는가?
synthetic_data: false

unit: {name: 도시철도 운영기관(도시), id_col: city_id}
time: {col: month_idx, freq: month, start: 0, end: 21}

treatment:
  definition: >-
    서울교통공사 1~8호선(서울). 기후동행카드 판매 2024-01-23, 시범사업 이용 시작 2024-01-27,
    본사업 2024-07-01. 첫 처치 월은 처음으로 한 달 내내 쓸 수 있었던 2024-02(19)로 둔다.
    2024-01(18)은 모든 도시에서 제외한다. 김포골드라인 편입(2024-03-30)은 서울교통공사 노선이 아니라 표본 밖이다.
  group_col: treated
  treat_time: 19
control:
  definition: >-
    부산교통공사, 대구교통공사, 광주교통공사, 대전교통공사 도시철도.
    분석 기간(2022-07~2024-04)에 기후동행카드를 쓸 수 없는 지역이다.
  rationale: >-
    같은 시기 전국 공통 요인(계절, 경기, 코로나 이후 회복)을 함께 받는 도시철도라서
    "기후동행카드가 없었다면"의 흐름을 일부 보여 줄 수 있다. 다만 도시마다 같은 시기 요금 변화가 달라
    완전한 대조군은 아니다. 알려진 요금 변화: 서울 2023-10-07(1,250→1,400원), 부산 2023-10-06(1,300→1,450원),
    부산 동백패스 2023-08-01, 대전 2024-01-01(1,250→1,550원), 대구 2024-01-13(1,250→1,500원), 광주 변화 없음.
    대전·대구는 처치 시점과 요금 인상이 겹치므로 둘을 뺀 비교(부산·광주만)를 따로 본다.

outcomes:
  - name: 평일 일평균 승차 인원(로그)
    col: log_weekday_boardings
    definition: >-
      log(해당 월 평일(월~금, 공휴일 제외)의 일 승차 인원 합계 평균). 승차만 센다(하차·환승 제외).
      분석 기간 내내 자료가 있는 역만 더해 역 신설·폐쇄의 영향을 뺀다.
    unit: "로그(명/일)"
    primary: true
    expected_direction: unknown
  - name: 주말·공휴일 일평균 승차 인원(로그)
    col: log_weekend_boardings
    definition: "log(해당 월 토·일·공휴일의 일 승차 인원 합계 평균). 같은 역 표본."
    unit: "로그(명/일)"
    primary: false
    expected_direction: unknown

estimator:
  method: event_study
  cluster_col: city_id
  ref_period: -2          # 2023-12. 바로 앞 달(2024-01)은 제외했으므로 -1 시점은 비어 있다
  window: [-8, 2]         # 사후 3개월(2024-02~04)
  alpha: 0.05

assumptions:
  - name: 평행추세
    description: "기후동행카드가 없었다면 서울과 비교 도시의 승차 추세는 같았을 것"
    check: pretrend_test
  - name: 같은 시기 다른 요금 변화 없음
    description: >-
      처치 전후에 서울 또는 비교 도시에만 있었던 요금 변화가 없을 것. 이미 알려진 위반: 대전(2024-01-01)·대구(2024-01-13)
      요금 인상, 서울·부산 2023-10 인상, 부산 동백패스(2023-08). 관련 법령·발표 목록을 다시 확인해 discussion.md에 적는다.
    check: manual
  - name: 미리 반응하지 않음
    description: "2023-09 발표 뒤 시행 전부터 이용이 바뀌었는지 가짜 시작일로 확인"
    check: placebo_time

refutations:
  - kind: placebo_time
    params: {shift: 6}    # 가짜 시작 2023-08(13). 사전 구간만 사용
  - kind: drop_unit
    params: {drop: [daegu, daejeon], reason: "처치 시점과 요금 인상이 겹치는 비교 도시를 뺀 재추정 (수동 실행, discussion.md에 기록)"}

abstention:
  - {when: pretrend_rejected, verdict: not_identified}
  - {when: placebo_significant, verdict: conditional}
  - {when: ci_crosses_zero, verdict: conditional, note: "효과 없음이 아니라 판별 불가로 보고"}
  - {when: few_treated_clusters, verdict: conditional, note: "처치 도시가 서울 1곳뿐이라 무작위화 추론의 경우의 수가 작다"}
  - {when: few_clusters, verdict: conditional, note: "도시 5곳뿐. 군집-강건 표준오차를 믿기 어렵다"}
  - {when: short_pre_period, verdict: conditional}

thresholds: {pretrend_alpha: 0.10, min_clusters: 20, min_pre_periods: 3}

